<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuniCity</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161a21; --card:#1c212a; --line:#2a303b; --fg:#e6e8ec; --dim:#8a919e;
    --acc:#6fbf73; --warn:#e0a458; --bad:#e06060; --snow:#8fc7ff; --input:#0c0e12; --overlay:rgba(0,0,0,.6); --btnfg:#0c0e12;
  }
  :root[data-theme="light"] {
    --bg:#f4f5f7; --panel:#ffffff; --card:#f7f8fa; --line:#d9dde3; --fg:#1b1f26; --dim:#5f6774;
    --acc:#2e8b3d; --warn:#b26f12; --bad:#c23b3b; --snow:#1f6fb2; --input:#ffffff; --overlay:rgba(20,24,30,.45); --btnfg:#ffffff;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  a { color:var(--dim); }

  header { display:flex; align-items:center; gap:18px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:20px; letter-spacing:.06em; }
  header .date { font-size:18px; color:var(--fg); }
  header .spacer { flex:1; }
  header button { width:auto; margin:0; padding:7px 14px; font-size:14px; }
  header .tools { display:flex; gap:6px; flex-wrap:wrap; }
  header .tools button.ghost { color:var(--fg); }
  header .tools button.ghost.attn { border-color:var(--warn); color:var(--warn); }
  header .primary { display:flex; gap:6px; align-items:center; }
  .cal { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:8px; padding:4px 10px; background:var(--card); cursor:pointer; }
  .cal .mo { font-size:20px; font-weight:700; letter-spacing:.04em; }
  .cal .yr { font-size:12px; color:var(--dim); line-height:1.2; }
  .cal .dots { display:grid; grid-template-columns:repeat(12, 7px); gap:2px; }
  .cal .dots i { width:7px; height:7px; border-radius:2px; background:var(--line); display:block; }
  .cal .dots i.done { background:var(--dim); } .cal .dots i.now { background:var(--acc); } .cal .dots i.snow { background:var(--snow); opacity:.7; } .cal .dots i.snow.done { opacity:1; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tabs button { width:auto; margin:0; background:transparent; color:var(--dim); border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 12px; font-weight:600; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  .items { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .items button { width:auto; margin:0; padding:8px 12px; }
  .offers { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
  .offer { border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--card); display:flex; flex-direction:column; gap:6px; }
  .offer .n { font-weight:700; font-size:15px; }
  .offer .price { font-size:22px; font-weight:700; }
  .offer .meter { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  .offer .meter span:first-child { width:78px; }
  .offer .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .offer .bar i { display:block; height:100%; background:var(--acc); }
  .offer .bar i.warn { background:var(--warn); } .offer .bar i.bad { background:var(--bad); }
  .offer .meter b { width:34px; text-align:right; color:var(--fg); }
  .offer .line { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); } .offer .line b { color:var(--fg); }
  .offer button { margin-top:auto; padding:8px; font-size:14px; }
  .offer .why { font-size:12px; color:var(--warn); }
  header .primary button { padding:8px 16px; }

  .stats { display:grid; grid-template-columns:repeat(6, 1fr); gap:1px; background:var(--line); border-bottom:1px solid var(--line); }
  .stat { background:var(--panel); padding:12px 18px; cursor:pointer; }
  .stat:hover { background:var(--card); }
  .stat .k { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); }
  .stat .v { font-size:24px; font-weight:600; margin-top:2px; }
  .stat .s { font-size:13px; color:var(--dim); }
  .good { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); } .snow { color:var(--snow); }

  main { display:grid; grid-template-columns: 1fr; min-height:calc(100vh - 140px); }
  main.showcfg { grid-template-columns: 1fr 340px; }
  aside.right { display:none; padding:16px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; max-height:calc(100vh - 140px); }
  main.showcfg aside.right { display:block; }
  section { padding:16px 20px; overflow:auto; max-width:1100px; }
  .banner { background:color-mix(in srgb, var(--warn) 18%, var(--panel)); border:1px solid var(--warn); color:var(--warn); border-radius:8px; padding:10px 14px; margin-bottom:12px; }
  .banner b { color:var(--fg); }

  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:18px 0 8px; }
  h2:first-child { margin-top:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:15px; }
  .card p { margin:4px 0; color:var(--dim); }
  .card b { color:var(--fg); }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .kv span:first-child { color:var(--dim); }

  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  label span { color:var(--dim); }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .slider { margin:8px 0 12px; } .slider .top { display:flex; justify-content:space-between; } .slider .top b { font-size:18px; }
  input[type=number], select { width:120px; background:var(--input); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; font-size:15px; text-align:right; }
  input.dirty { border-color:var(--warn); }
  input:disabled, select:disabled { opacity:.5; }
  button { background:var(--acc); color:var(--btnfg); border:0; border-radius:6px; padding:10px 14px; font:inherit; font-weight:700; cursor:pointer; width:100%; margin-top:8px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  button.warn { background:var(--warn); }
  button:disabled { opacity:.35; cursor:default; }
  .row { display:flex; gap:8px; } .row button { margin-top:8px; }
  small { color:var(--dim); display:block; margin-top:8px; line-height:1.45; font-size:13px; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.12em; margin:18px 0 8px; }

  .bid { border:1px solid var(--line); border-radius:6px; padding:10px; margin:8px 0; }
  .bid .t { font-weight:600; }
  .bid .d { color:var(--dim); font-size:13px; }
  .bid button { margin-top:8px; padding:7px; font-size:14px; }

  table { border-collapse:collapse; width:100%; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:14px; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--bg); }
  td.l, th.l { text-align:left; }
  tr.year td { border-bottom:2px solid var(--dim); }
  tr.inc td.l:first-child { color:var(--acc); }
  .wrap { overflow:auto; max-height:52vh; border:1px solid var(--line); border-radius:8px; }

  .overlay { position:fixed; inset:0; background:var(--overlay); display:none; align-items:flex-start; justify-content:center; padding-top:6vh; z-index:10; }
  .overlay.open { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; width:min(720px, 94vw); max-height:90vh; overflow:auto; padding:20px 24px; }
  .modal h3 { margin:0 0 4px; font-size:20px; }
  .modal .x { float:right; width:auto; margin:0; padding:4px 10px; font-size:14px; }
  .modal .sub { color:var(--dim); margin-bottom:14px; }
  .modal .cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .modal label input { width:140px; }

  @media (max-width: 960px) {
    .stats { grid-template-columns:repeat(3, 1fr); }
    header { flex-wrap:wrap; }
    main, main.showcfg { grid-template-columns:1fr; }
    aside.right { max-height:none; border:0; border-top:1px solid var(--line); }
    .modal .cols { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>MUNICITY</h1>
  <span class="date" id="date" hidden>Founding day</span>
  <div class="tools">
    <button class="ghost" data-tool="budget" id="tBudget">Budget</button>
    <button class="ghost" data-tool="finance">Finance</button>
    <button class="ghost" data-tool="buy">Buy</button>
    <button class="ghost" data-tool="policy">Policy</button>
    <button class="ghost" data-tool="town">Town</button>
  </div>
  <span class="spacer"></span>
  <div class="primary">
    <div class="cal" id="cal" title="Calendar"><div><div class="mo" id="calMo">APR</div><div class="yr" id="calYr">Year 1 · FY 1</div></div><div class="dots" id="calDots"></div></div>
    <button id="endTurn">End Month</button>
    <button id="skipYear" class="ghost">End Fiscal Year</button>
  </div>
  <button class="ghost" id="themeToggle" title="Light / dark">☀</button>
  <button class="ghost" id="cfgToggle" title="Every constant, editable">⚙</button>
</header>

<div class="stats">
  <div class="stat"><div class="k">Population</div><div class="v" id="sPop">—</div><div class="s" id="sPopS"></div></div>
  <div class="stat"><div class="k">Treasury</div><div class="v" id="sTre">—</div><div class="s" id="sTreS"></div></div>
  <div class="stat"><div class="k">Desirability</div><div class="v" id="sDes">—</div><div class="s" id="sDesS"></div></div>
  <div class="stat"><div class="k">Roads</div><div class="v" id="sRoad">—</div><div class="s" id="sRoadS"></div></div>
  <div class="stat"><div class="k">Weather</div><div class="v" id="sWx">—</div><div class="s" id="sWxS"></div></div>
  <div class="stat"><div class="k">Status</div><div class="v" id="sSt">—</div><div class="s" id="sStS"></div></div>
</div>

<main id="main">
  <section>
    <div id="banner"></div>
    <div class="card" id="monthCard"><h3>Welcome</h3><p>Found a town to begin.</p></div>
    <h2>Ledger <label style="display:inline-flex;gap:6px;margin-left:12px;font-size:13px;text-transform:none;letter-spacing:0"><input type="checkbox" id="allRows"> show every month</label></h2>
    <div class="wrap"><table id="out"></table></div>
  </section>

  <aside class="right">
    <h2>Config <span id="dirtyCount"></span></h2>
    <div id="cfg"></div>
    <button class="ghost" id="reset">Reset to defaults</button>
    <small>Every number the sim uses. Changes apply to the next town you found or bench run.</small>
  </aside>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="ghost x" id="mClose">✕</button>
    <h3 id="mTitle"></h3>
    <div class="sub" id="mSub"></div>
    <div id="mBody"></div>
  </div>
</div>

<script type="module">
  import { config as defaults } from './sim/config.js';
  import { createTurnZero } from './sim/state.js';
  import { createRng } from './sim/rng.js';
  import { resolveTurn, canIncorporate, incorporate } from './sim/resolveTurn.js';
  import { buyAsset, adoptBudget, setTaxes } from './sim/actions.js';
  import { CATALOG, findOffer, purchaseBlocker, vehicleSlots, hasMechanic, isVehicle, YARD_SURFACE } from './sim/catalog.js';
  import { assessedValueTotal } from './sim/finance.js';
  import { CLIMATES, yearOf } from './sim/climate.js';
  import { annualReview, loanProducts, borrow, debtCapacity, outstandingPrincipal, reserveMonths, annualDebtService, monthlyPayment } from './sim/finance.js';
  import { MONTHS, monthIndex, monthLabel } from './sim/climate.js';
  import { SCENARIOS } from './sim/run.js';

  const $ = id => document.getElementById(id);
  const fmt$ = n => (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
  const cls = (v, warnBelow, badBelow) => v < badBelow ? 'bad' : v < warnBelow ? 'warn' : 'good';
  const gradeCls = g => g === 'A' || g === 'B' ? 'good' : g === 'C' ? 'warn' : 'bad';
  const pct = r => (r * 100).toFixed(1) + '%';
  const kv = (k, v, c = '') => `<div class="kv"><span>${k}</span><b class="${c}">${v}</b></div>`;

  // ── config overrides ──────────────────────────────────────────────────────
  const overrides = {};
  const liveConfig = () => ({ ...structuredClone(defaults), ...overrides });
  function renderConfig() {
    const el = $('cfg'); el.innerHTML = ''; let dirty = 0;
    for (const [k, v] of Object.entries(defaults)) {
      if (typeof v !== 'number') continue;
      const row = document.createElement('label'); row.innerHTML = `<span class="mono" style="font-size:13px">${k}</span>`;
      const inp = document.createElement('input'); inp.type = 'number'; inp.value = overrides[k] ?? v;
      inp.step = Math.abs(v) >= 100 ? 100 : (Number.isInteger(v) ? 1 : 0.01);
      if (k in overrides) { inp.classList.add('dirty'); dirty++; }
      inp.addEventListener('change', () => { const n = Number(inp.value); if (n === v) delete overrides[k]; else overrides[k] = n; renderConfig(); });
      row.appendChild(inp); el.appendChild(row);
    }
    $('dirtyCount').textContent = dirty ? `· ${dirty} changed` : '';
  }
  $('reset').addEventListener('click', () => { for (const k in overrides) delete overrides[k]; renderConfig(); });
  $('cfgToggle').addEventListener('click', () => $('main').classList.toggle('showcfg'));

  // ── theme ─────────────────────────────────────────────────────────────────
  const applyTheme = t => { document.documentElement.dataset.theme = t; $('themeToggle').textContent = t === 'light' ? '☾' : '☀'; try { localStorage.setItem('municity.theme', t); } catch {} };
  let theme = 'dark'; try { theme = localStorage.getItem('municity.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch {}
  applyTheme(theme);
  $('themeToggle').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));

  // ── calendar ──────────────────────────────────────────────────────────────
  function renderCalendar(st, cfg) {
    const m = st.turn ? monthIndex(st.turn, cfg) : cfg.FOUNDING_MONTH;
    const fyMonth = st.turn % 12;                       // 0 = fiscal year just closed
    $('calMo').textContent = MONTHS[m].toUpperCase();
    $('calYr').textContent = st.turn ? `Year ${yearOf(st.turn)} · FY month ${fyMonth || 12}/12` : 'Founding day';
    const snow = CLIMATES[st.tile.climate].snow;
    let dots = '';
    for (let i = 1; i <= 12; i++) {
      const mi = (cfg.FOUNDING_MONTH + i - 1) % 12;
      const cl = [snow[mi] > 0 ? 'snow' : '', i < (fyMonth || 12) || (fyMonth === 0 && st.turn) ? 'done' : '', i === (fyMonth || (st.turn ? 12 : 0)) ? 'now' : ''].join(' ');
      dots += `<i class="${cl}" title="${MONTHS[mi]}"></i>`;
    }
    $('calDots').innerHTML = dots;
  }
  $('cal').addEventListener('click', () => runTool('weather'));

  // ── modal ─────────────────────────────────────────────────────────────────
  let activeTool = null;
  function openModal(title, sub, body, mount) {
    $('mTitle').textContent = title; $('mSub').innerHTML = sub ?? ''; $('mBody').innerHTML = body;
    if (mount) mount($('mBody'));
    $('overlay').classList.add('open');
  }
  function closeModal() { $('overlay').classList.remove('open'); activeTool = null; }
  const runTool = name => { activeTool = name; tools[name](); };
  $('mClose').addEventListener('click', closeModal);
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── game ──────────────────────────────────────────────────────────────────
  let game = null;   // { cfg, rng, state, rows }
  const scenarioBudget = name => { const s = SCENARIOS[name]; return { budget: { publicWorks: { ...s.publicWorks }, services: { ...s.services } }, millage: s.millage }; };

  function found(scenario = 'balanced', seed = 1) {
    const cfg = liveConfig();
    const state = createTurnZero(scenarioBudget(scenario), cfg);
    game = { cfg, rng: createRng(seed), state, rows: [state] };
    closeModal(); render();
  }
  function step() {
    game.state = resolveTurn(game.state, game.rng, game.cfg);
    game.rows.push(game.state);
    if (game.state.turn % 12 === 0) game.state = game.rows[game.rows.length - 1] = annualReview(game.state, game.cfg, game.rng);
    render();
    if (game.state.turn % 12 === 0) runTool('budget');
  }
  function replaceState(next) { game.state = next; game.rows[game.rows.length - 1] = next; render(); if (activeTool) tools[activeTool](); }
  const act = fn => { try { replaceState(fn(game.state)); } catch (e) { alert(e.message); } };

  $('endTurn').addEventListener('click', step);
  $('skipYear').addEventListener('click', () => { do step(); while (game.state.turn % 12 !== 0); });
  $('allRows').addEventListener('change', render);

  // ── tools ─────────────────────────────────────────────────────────────────
  const tools = {
    budget() {
      const st = game.state, cfg = game.cfg, yearEnd = st.turn % 12 === 0 && st.turn > 0;
      const yr = game.rows.slice(-12);
      const sum = k => yr.reduce((s, r) => s + (r.lastTurn[k] ?? 0), 0);
      const rev = sum('revenue'), exp = sum('expenses');
      const rm = reserveMonths(st), road = st.infrastructure.reduce((s, i) => s + i.condition, 0) / st.infrastructure.length;
      const sq = st.lastTurn.inputs?.serviceQuality ?? 100, need = st.population * cfg.SERVICE_NEED_PER_CAPITA;
      const maint = st.infrastructure.reduce((s, i) => s + i.maintNeed, 0) * 12;
      const review = `<div class="card"><h3>${st.turn ? 'Year in review' : 'Starting position'}</h3>
        ${st.turn ? kv('Revenue', fmt$(rev)) + kv('Spent', fmt$(exp)) + kv('· snow removal', fmt$(sum('plowCost'))) + kv('· repairs (capital)', fmt$(sum('repairSpend'))) + kv('· equipment upkeep', fmt$(sum('assetUpkeep'))) + kv('· debt service', fmt$(sum('debtService'))) + kv('Net', fmt$(rev - exp), rev - exp < 0 ? 'bad' : 'good') : kv('Treasury', fmt$(st.treasury)) + kv('Seed income', fmt$(st.tile.seed.income) + '/mo')}
      </div>
      <div class="card"><h3>Where things stand</h3>
        ${kv('Population', st.population)}${kv('Reserves', isFinite(rm) ? rm.toFixed(1) + ' months' : '∞', cls(rm, 6, 3))}${kv('Desirability', st.desirability.toFixed(0), cls(st.desirability, 55, 45))}
        ${kv('Road condition', road.toFixed(0), cls(road, 70, 40))}${kv('Service quality', sq.toFixed(0), cls(sq, 70, 40))}${kv('Road maintenance need', fmt$(maint) + '/yr')}
        ${kv('Debt service', fmt$(annualDebtService(st)) + '/yr')}${kv('Credit', `${st.credit.grade}${st.credit.previous && st.credit.previous !== st.credit.grade ? ` (was ${st.credit.previous})` : ''} · ${st.credit.score}/100`, gradeCls(st.credit.grade))}
      </div>`;
      const locked = !!st.takeover;
      const form = locked
        ? `<div class="banner"><b>The county controls this budget.</b> Operations are at maintenance floor, capital is zero, millage is ${st.millage}. Control returns when the balance is positive with ${cfg.TAKEOVER_EXIT_RESERVE} months of reserves.</div>` + kv('Public Works ops', fmt$(st.budget.publicWorks.operations) + '/yr') + kv('Services ops', fmt$(st.budget.services.operations) + '/yr') + kv('Millage', st.millage)
        : `<label><span>Public Works — operations /yr</span><input type="number" id="pwOps" step="100" value="${st.budget.publicWorks.operations}"></label>
           <label><span>Public Works — capital /yr</span><input type="number" id="pwCap" step="100" value="${st.budget.publicWorks.capital}"></label>
           <label><span>Services — operations /yr</span><input type="number" id="svcOps" step="100" value="${st.budget.services.operations}"></label>
           ${kv('Tax rate', `${st.millage} mills <span style="color:var(--dim);font-weight:400">· set under Finance › Taxes</span>`)}
           <div class="card" style="margin-top:10px">${kv('Planned spend /yr', '<span id="bPlan"></span>')}${kv(st.turn ? 'vs last year\'s revenue' : 'vs seed income', '<span id="bVs"></span>')}</div>
           <button id="adopt">${yearEnd ? 'Adopt budget for Year ' + (st.turn / 12 + 1) : 'Adopt changes'}</button>
           <small>Operations are charged monthly. Capital is an allowance spent on repairs as needed. Services need about ${fmt$(need)}/yr for full quality at current population. ${yearEnd ? 'Close to keep last year\'s budget.' : st.incorporated ? 'Mid-year changes are allowed for now; the annual lock arrives with board meetings.' : ''}</small>`;
      openModal(yearEnd ? `Annual budget — Year ${st.turn / 12 + 1}` : 'Budget', yearEnd ? `Year ${st.turn / 12} closed.` : `Current appropriations · next review in ${12 - (st.turn % 12)} month${12 - (st.turn % 12) === 1 ? '' : 's'}`,
        `<div class="cols"><div>${review}</div><div>${form}</div></div>`,
        () => {
          if (locked) return;
          const base = st.turn ? rev : st.tile.seed.income * 12;
          const plan = () => { const p = (+$('pwOps').value) + (+$('pwCap').value) + (+$('svcOps').value); $('bPlan').textContent = fmt$(p); const d = base - p; $('bVs').innerHTML = `<span class="${d < 0 ? 'bad' : 'good'}">${d < 0 ? '−' : '+'}${fmt$(Math.abs(d))}</span>`; };
          for (const id of ['pwOps', 'pwCap', 'svcOps']) $(id).oninput = plan; plan();
          $('adopt').onclick = () => { const b = { publicWorks: { operations: +$('pwOps').value, capital: +$('pwCap').value }, services: { operations: +$('svcOps').value, capital: 0 } }; closeModal(); act(s => adoptBudget(s, b)); };
        });
    },

    finance(tab) {
      const st = game.state, cfg = game.cfg;
      tab = tab ?? tools._finTab ?? 'taxes'; tools._finTab = tab;
      const locked = !!st.takeover;
      const out = outstandingPrincipal(st), dcap = debtCapacity(st, cfg), rm = reserveMonths(st), products = loanProducts(st, cfg);
      const av = assessedValueTotal(st);
      const tabs = { taxes: 'Taxes', fees: 'Fees', credit: 'Credit', bonds: st.incorporated ? 'Bonds & loans' : 'Loans' };
      let body = '', mount = null;
      if (tab === 'taxes') {
        const taxAt = m => av * m / 1000 / 12;
        body = `<div class="cols"><div>
          <div class="slider"><div class="top"><span>Property tax (millage)</span><b id="mVal">${st.millage}</b></div><input type="range" id="mSlide" min="0" max="${cfg.AUSTERITY_MILLAGE_CAP}" step="0.5" value="${st.millage}" ${locked ? 'disabled' : ''}></div>
          <div class="card">${kv('Assessed value on the rolls', fmt$(av))}${kv('Property tax at this rate', `<span id="mRev">${fmt$(taxAt(st.millage))}</span>/mo`)}${kv('Tax burden input', `<span id="mBurden"></span> <span style="color:var(--dim)">(50 at ${cfg.MILLAGE_REF} mills)</span>`)}${st.incorporated ? '' : kv('Seed income', fmt$(st.tile.seed.income) + '/mo', 'good')}</div>
          ${locked ? '<p class="bad">The county sets taxes during a takeover.</p>' : '<button id="mApply">Set tax rate</button>'}
          <small>Only completed homes are assessed. ${st.incorporated ? 'Property tax is your main revenue.' : 'Until you incorporate, the land pays you and property tax is small.'} Changes take effect next month.</small>
        </div><div class="card"><h3>How taxes land</h3><p>Desirability reads tax burden inverted: at ${cfg.MILLAGE_REF} mills it contributes 50; at ${cfg.MILLAGE_REF * 2} mills it contributes 0. Fees add to the same burden. Raising millage buys revenue now and costs migration later.</p></div></div>`;
        mount = () => {
          const upd = () => { const m = +$('mSlide').value; $('mVal').textContent = m; $('mRev').textContent = fmt$(taxAt(m)); const fpc = st.fees.sticker + st.fees.permit * 0.1; $('mBurden').textContent = Math.round(100 - Math.min(100, m / cfg.MILLAGE_REF * 50 + fpc / cfg.FEE_BURDEN_REF * 25)); };
          $('mSlide').oninput = upd; upd();
          if ($('mApply')) $('mApply').onclick = () => act(s => setTaxes(s, { millage: +$('mSlide').value }));
        };
      } else if (tab === 'fees') {
        body = `<div class="cols"><div>
          <div class="slider"><div class="top"><span>Vehicle sticker, per resident per year</span><b>$<span id="sVal">${st.fees.sticker}</span></b></div><input type="range" id="sSlide" min="0" max="240" step="10" value="${st.fees.sticker}" ${locked ? 'disabled' : ''}></div>
          <div class="slider"><div class="top"><span>Building permit, per home started</span><b>$<span id="pVal">${st.fees.permit}</span></b></div><input type="range" id="pSlide" min="0" max="5000" step="250" value="${st.fees.permit}" ${locked ? 'disabled' : ''}></div>
          <div class="card">${kv('Sticker revenue', `<span id="sRev"></span>/mo at pop ${st.population}`)}${kv('Permit revenue', `<span id="pRev"></span> per ${cfg.ABSORPTION_RATE}-home month`)}${kv('Added tax burden', `<span id="fBurden"></span> pts`)}</div>
          ${locked ? '' : '<button id="fApply">Set fees</button>'}
          <small>Fees are small money that reads as tax burden. Permits only bite when homes are being built.</small>
        </div><div class="card"><h3>Policies</h3><p>Standing rules live under <b>Policy</b> (auto-zoning, incorporation). More fees arrive with departments: inspections, licenses, utility hookups.</p></div></div>`;
        mount = () => {
          const upd = () => { const sv = +$('sSlide').value, pv = +$('pSlide').value; $('sVal').textContent = sv; $('pVal').textContent = pv; $('sRev').textContent = fmt$(st.population * sv / 12); $('pRev').textContent = fmt$(pv * cfg.ABSORPTION_RATE); $('fBurden').textContent = Math.round((sv + pv * 0.1) / cfg.FEE_BURDEN_REF * 25); };
          $('sSlide').oninput = upd; $('pSlide').oninput = upd; upd();
          if ($('fApply')) $('fApply').onclick = () => act(s => setTaxes(s, { sticker: +$('sSlide').value, permit: +$('pSlide').value }));
        };
      } else if (tab === 'credit') {
        const i = st.credit.inputs;
        body = `<div class="cols"><div class="card"><h3>Rating ${st.credit.grade} <span style="font-weight:400;color:var(--dim)">· ${st.credit.score}/100</span></h3>
            ${i ? kv('Reserves (40 pts)', `${i.reserveMonths.toFixed(1)} mo`, cls(i.reserveMonths, 6, 3)) + kv('Deficit months (25 pts)', i.deficitMonths, i.deficitMonths ? 'bad' : 'good') + kv('Leverage (20 pts)', pct(i.leverage), cls(1 - i.leverage, 0.6, 0.3)) + kv('Debt service ÷ revenue (15 pts)', pct(i.debtServiceRatio), cls(1 - i.debtServiceRatio, 0.85, 0.7)) : '<p>First review at the end of Year 1.</p>'}
            ${st.credit.probation ? '<p class="warn">On probation after a takeover: next review is capped at D.</p>' : ''}
            <small>Reviewed every fiscal year end. Locked in between — so the books at review time are what count. Spread on new debt: A +0 · B +1 · C +2 · D +3.5 · F +6 (bond market closed).</small></div>
          <div class="card"><h3>Right now</h3>${kv('Reserves', isFinite(rm) ? rm.toFixed(1) + ' mo' : '∞', cls(rm, 6, 3))}${kv('Deficit streak', st.deficitStreak, st.deficitStreak ? 'bad' : 'good')}${kv('Debt', fmt$(out))}${kv('Capacity', fmt$(dcap))}${kv('Debt service', fmt$(annualDebtService(st) / 12) + '/mo')}${kv('County base rate', pct(st.county.baseRate))}</div></div>`;
      } else {
        const amt = tools._loanAmt ?? 50000;
        const tiles = products.map(p => { const a = Math.min(amt, p.max); const pay = a > 0 ? monthlyPayment(a, p.rate, p.termTurns) : 0; const ok = a > 0 && !locked; return `<div class="offer"><div class="n">${p.label}</div><div class="price">${pct(p.rate)}</div>
            <div class="line"><span>Term</span><b>${p.termTurns / 12} yrs</b></div><div class="line"><span>Limit</span><b>${fmt$(p.max)}</b></div>
            <div class="line"><span>On ${fmt$(a)}</span><b>${fmt$(pay)}/mo</b></div><div class="line"><span>Total interest</span><b>${fmt$(pay * p.termTurns - a)}</b></div>
            ${p.kind === 'county' ? '<div class="why">County: always available, worse terms</div>' : ''}${locked ? '<div class="why">No borrowing during takeover</div>' : a < amt ? `<div class="why">Capped at ${fmt$(p.max)}</div>` : ''}
            <button class="${ok ? '' : 'ghost'}" data-loan="${p.id}" ${ok ? '' : 'disabled'}>${ok ? `Borrow ${fmt$(a)}` : 'Unavailable'}</button></div>`; }).join('');
        body = `<div class="slider"><div class="top"><span>Amount</span><b>$<span id="lVal">${amt.toLocaleString('en-US')}</span></b></div><input type="range" id="lSlide" min="5000" max="${Math.max(50000, Math.ceil(Math.max(...products.map(p => p.max)) / 5000) * 5000)}" step="5000" value="${amt}"></div>
          <div class="offers">${tiles}</div>
          ${st.debt.length ? `<h3 style="margin:16px 0 8px">Notes outstanding</h3><div class="card">${st.debt.map(d => kv(d.label, `${fmt$(d.principal)} · ${pct(d.rate)} · ${fmt$(d.payment)}/mo · ${d.remainingTurns} mo left`)).join('')}</div>` : ''}
          <small>${st.incorporated ? (st.credit.grade === 'F' ? 'Bond market is closed at F.' : `Bonds are capped at ${pct(cfg.DEBT_LIMIT_RATIO)} of assessed value (${fmt$(dcap)}). Grow the tax base to borrow more.`) : 'Townships get county loans only: flat caps, higher rates. Incorporate to issue bonds.'}</small>`;
        mount = el => {
          $('lSlide').oninput = () => { tools._loanAmt = +$('lSlide').value; tools.finance('bonds'); };
          for (const b of el.querySelectorAll('[data-loan]')) b.onclick = () => { const p = products.find(x => x.id === b.dataset.loan); act(s => borrow(s, p, Math.min(amt, p.max))); };
        };
      }
      openModal('Finance', `Treasury ${fmt$(st.treasury)} · reserves ${isFinite(rm) ? rm.toFixed(1) + ' mo' : '∞'} · rating ${st.credit.grade} · debt ${fmt$(out)}`,
        `<div class="tabs">${Object.entries(tabs).map(([id, l]) => `<button class="${id === tab ? 'on' : ''}" data-tab="${id}">${l}</button>`).join('')}</div>${body}`,
        el => { for (const b of el.querySelectorAll('[data-tab]')) b.onclick = () => tools.finance(b.dataset.tab); if (mount) mount(el); });
    },

    buy(tab, itemId) {
      const st = game.state, cfg = game.cfg;
      tab = tab ?? tools._buyTab ?? 'yard'; tools._buyTab = tab;
      const catId = CATALOG[tab] ? tab : 'yard'; const cat = CATALOG[catId]; const itemIds = Object.keys(cat.items);
      itemId = itemId && cat.items[itemId] ? itemId : (tools._buyItem?.[catId] ?? itemIds[0]); (tools._buyItem ??= {})[catId] = itemId;
      const item = cat.items[itemId];
      const bestLoan = loanProducts(st, cfg).filter(p => p.max > 0).sort((a, b) => a.rate - b.rate)[0];
      const meter = (label, v, warnBelow = 60, badBelow = cfg.OUT_OF_SERVICE_BELOW) => `<div class="meter"><span>${label}</span><div class="bar"><i class="${v < badBelow ? 'bad' : v < warnBelow ? 'warn' : ''}" style="width:${v}%"></i></div><b>${Math.round(v)}</b></div>`;
      const offers = item.offers.map(o => {
        const full = findOffer(o.id);
        const why = purchaseBlocker(st, full, cfg);
        const fin = bestLoan ? monthlyPayment(o.price, bestLoan.rate, Math.min(bestLoan.termTurns, Math.max(24, o.lifespanTurns))) : null;
        return `<div class="offer"><div class="n">${o.name}</div><div class="price">${fmt$(o.price)}</div>
          ${meter('Condition', o.condition)}
          <div class="line"><span>Expected life</span><b>${(o.lifespanTurns / 12).toFixed(0)} yrs</b></div>
          <div class="line"><span>Upkeep</span><b>${fmt$(o.maintNeed)}/mo${o.warrantyTurns ? ` after ${o.warrantyTurns / 12} yr warranty` : ''}</b></div>
          ${item.slot ? `<div class="line"><span>Adds</span><b>+${item.slot} vehicle slot${item.mechanic ? ' · mechanic' : ''}</b></div>` : ''}
          <div class="line"><span>Financed</span><b>${fin ? `≈ ${fmt$(fin)}/mo at ${pct(bestLoan.rate)}` : '—'}</b></div>
          <div class="line"><span>Delivery</span><b>${o.deliveryTurns} mo</b></div>
          ${why ? `<div class="why">${why}</div>` : ''}
          <button class="${why ? 'ghost' : ''}" data-offer="${o.id}" ${why ? 'disabled' : ''}>${why ? 'Unavailable' : 'Buy'}</button></div>`;
      }).join('');
      const owned = st.assets.map(a => { const age = st.turn - a.arrivesTurn; return `<div class="offer"><div class="n">${a.label}</div>
          ${st.turn < a.arrivesTurn ? `<div class="why">Arrives in ${a.arrivesTurn - st.turn} mo</div>` : a.idled ? '<div class="why">Furloughed by the county</div>' : a.condition < cfg.OUT_OF_SERVICE_BELOW ? '<div class="why">Out of service — needs repair</div>' : ''}
          ${meter('Condition', a.condition)}
          <div class="line"><span>Age</span><b>${Math.max(0, age)} / ${a.lifespanTurns} mo${age > a.lifespanTurns ? ' <span class="bad">past life</span>' : ''}</b></div>
          <div class="line"><span>Upkeep</span><b>${st.turn <= a.warrantyUntil ? `warranty, ${a.warrantyUntil - st.turn} mo` : fmt$(a.maintNeed * (age > a.lifespanTurns ? cfg.PAST_LIFE_UPKEEP_MULT : 1)) + '/mo'}</b></div>
          ${a.slot ? `<div class="line"><span>Adds</span><b>+${a.slot} slot${a.mechanic ? ' · mechanic' : ''}</b></div>` : ''}
          <div class="line"><span>Tier</span><b>${a.tier === 'base' ? 'base — county can’t touch it' : 'add-on'}</b></div></div>`; }).join('');
      const slots = vehicleSlots(st, cfg), vehicles = st.assets.filter(isVehicle).length;
      openModal('Buy', `${YARD_SURFACE[st.tile.climate]} yard · ${vehicles}/${slots} vehicle slots${st.incorporated ? ' · town hall' : ` (max ${cfg.YARD_SLOTS_TOWNSHIP} until incorporation)`}${hasMechanic(st) ? ' · mechanic on staff' : ''}. Condition is efficiency; it falls with age${hasMechanic(st) ? ' (halved by your mechanic)' : ''} and use, and Public Works capital repairs it. Under ${cfg.OUT_OF_SERVICE_BELOW} a unit is out of service.`,
        `<div class="tabs">${Object.entries(CATALOG).map(([id, c]) => `<button class="${id === tab ? 'on' : ''}" data-tab="${id}">${c.label}</button>`).join('')}<button class="${tab === 'owned' ? 'on' : ''}" data-tab="owned">Owned (${st.assets.length})</button></div>
         ${tab === 'owned' ? `<div class="offers">${owned || '<p>Nothing yet. The yard itself came with the land.</p>'}</div>` : `<div class="items">${itemIds.map(id => `<button class="${id === itemId ? '' : 'ghost'}" data-item="${id}">${cat.items[id].label}</button>`).join('')}</div><p style="color:var(--dim);margin:0 0 10px">${item.blurb}</p><div class="offers">${offers}</div>`}`,
        el => {
          for (const b of el.querySelectorAll('[data-tab]')) b.onclick = () => tools.buy(b.dataset.tab);
          for (const b of el.querySelectorAll('[data-item]')) b.onclick = () => tools.buy(catId, b.dataset.item);
          for (const b of el.querySelectorAll('[data-offer]')) b.onclick = () => act(s => buyAsset(s, b.dataset.offer, cfg));
        });
    },

    policy() {
      const st = game.state, cfg = game.cfg;
      const body = `<div class="card">${kv('Auto-zoning', `<label style="margin:0"><input type="checkbox" id="pAutoZone" ${st.policy.autoZone ? 'checked' : ''} ${st.takeover ? 'disabled' : ''}></label>`)}<small>When demand exists and land runs out, zone ${cfg.LOT_BATCH} lots and build a road segment for ${fmt$(cfg.LOT_BATCH * cfg.LOT_ZONING_COST + cfg.ROAD_BUILD_COST)}. Becomes a monthly decision when board meetings arrive.</small></div>
        <div class="card">${kv('Incorporation', st.incorporated ? '<span class="good">Incorporated</span>' : canIncorporate(st, cfg) ? '<button id="pInc" class="warn" style="width:auto;margin:0;padding:6px 12px">Incorporate now</button>' : `at population ${cfg.INCORPORATION_POP}`)}<small>${st.incorporated ? 'Property tax is your revenue. Bonds available.' : 'Ends seed income from the land; switches you to property tax and opens the bond market. Your call, your timing.'}</small></div>`;
      openModal('Policy', 'Standing rules the town applies without asking each month.', body, el => {
        const cb = $('pAutoZone'); if (cb) cb.onchange = () => act(s => { const n = structuredClone(s); n.policy.autoZone = cb.checked; return n; });
        const inc = $('pInc'); if (inc) inc.onclick = () => { closeModal(); act(s => incorporate(s)); };
      });
    },

    town() {
      const body = `<div class="cols"><div class="card"><h3>New town</h3>
          <label><span>Starting budget</span><select id="nScenario">${Object.keys(SCENARIOS).map(n => `<option>${n}</option>`).join('')}</select></label>
          <label><span>Seed</span><input type="number" id="nSeed" value="${game ? game.rows[0].turn === 0 ? 1 : 1 : 1}"></label>
          <button id="nFound" class="warn">Found a new town</button><small>Abandons the current one. The starting budget is your first decision; you revisit it every year.</small></div>
        <div class="card"><h3>Bench — hands off</h3>
          <label><span>Years</span><input type="number" id="bYears" value="10"></label>
          <label><span>Auto-incorporate</span><input type="checkbox" id="bInc" checked></label>
          <label><span>Plow at start</span><select id="bPlow"><option value="">none</option>${CATALOG.vehicles.items.plow.offers.map(o => `<option value="${o.id}">${o.name}</option>`).join('')}</select></label>
          <label><span>Loan at start</span><input type="number" id="bLoan" value="0" step="10000"></label>
          <button id="bRun" class="ghost">Run with current settings</button><small>Runs the budget you'd found with, untouched, for the whole span. For seeing what a strategy does.</small></div></div>`;
      openModal('Town', 'Start over, or run the sim hands-off.', body, () => {
        $('nFound').onclick = () => found($('nScenario').value, +$('nSeed').value);
        $('bRun').onclick = () => {
          const cfg = liveConfig(), rng = createRng(+$('nSeed').value);
          let st = createTurnZero(scenarioBudget($('nScenario').value), cfg);
          const founding = { budget: structuredClone(st.budget), millage: st.millage };
          try {
            const loan = +$('bLoan').value; if (loan > 0) st = borrow(st, loanProducts(st, cfg).find(p => p.id === 'county-long'), loan);
            const plowId = $('bPlow').value; if (plowId) st = buyAsset(st, plowId, cfg);
          } catch (e) { alert(e.message); return; }
          const rows = [st];
          for (let t = 0; t < +$('bYears').value * 12; t++) {
            st = resolveTurn(st, rng, cfg);
            if (st.turn % 12 === 0) { st = annualReview(st, cfg, rng); if (!st.takeover) { st.budget = structuredClone(founding.budget); st.millage = founding.millage; } }
            if ($('bInc').checked && canIncorporate(st, cfg)) st = incorporate(st); rows.push(st);
          }
          game = { cfg, rng, state: st, rows }; closeModal(); render();
        };
      });
    },

    // stat-tile drilldowns
    population() {
      const st = game.state, lt = st.lastTurn;
      const cap = st.lots.filter(l => l.state === 'occupied').reduce((s, l) => s + l.capacity, 0);
      openModal('Population', `${st.population} residents`, `<div class="card">${kv('Housing capacity', cap)}${kv('Vacancy', Math.max(0, cap - st.population))}${kv('Lots', `${st.lots.length} zoned · ${st.lots.filter(l => l.state === 'occupied').length} homes · ${st.lots.filter(l => l.state === 'construction').length} building`)}${kv('Net migration this month', lt.netMigration ?? 0)}${kv('Carry (fractional people)', (st.migrationCarry ?? 0).toFixed(2))}</div><small>People arrive when desirability is above 50 and there's housing. They leave when it's below. Word of mouth scales with population; the land itself draws ${game.cfg.SEED_PULL}/mo at full pull.</small>`);
    },
    desirability() {
      const st = game.state, i = st.lastTurn.inputs, W = game.cfg.DESIRABILITY_WEIGHTS;
      openModal('Desirability', `${st.desirability.toFixed(1)} — 50 is neutral`, i ? `<div class="card">${kv(`Service quality × ${W.serviceQuality}`, i.serviceQuality.toFixed(0), cls(i.serviceQuality, 70, 40))}${kv(`Roads (condition × open) × ${W.infrastructure}`, i.infra.toFixed(0), cls(i.infra, 70, 40))}${kv(`Tax burden (inverted) × ${W.taxBurden}`, i.taxBurden.toFixed(0), cls(i.taxBurden, 50, 25))}${kv(`Safety × ${W.safety}`, i.safety.toFixed(0) + ' <span style="color:var(--dim)">(= services, for now)</span>')}${kv(`Amenities × ${W.amenities}`, i.amenities.toFixed(0) + ' <span style="color:var(--dim)">(stub)</span>')}</div>` : '<p>No month resolved yet.</p>');
    },
    roads() {
      const st = game.state, lt = st.lastTurn;
      openModal('Roads', `${st.infrastructure.length} segment${st.infrastructure.length === 1 ? '' : 's'}`, `<div class="card">${st.infrastructure.map(r => kv(r.id, r.condition.toFixed(0), cls(r.condition, 70, 40))).join('')}</div><div class="card">${kv('Maintenance need', fmt$(st.infrastructure.reduce((s, i) => s + i.maintNeed, 0)) + '/mo')}${kv('Funded', lt.fundingRatio != null ? (lt.fundingRatio * 100).toFixed(0) + '%' : '—')}${kv('Decay this month', lt.decay != null ? lt.decay.toFixed(2) + ' pts' : '—')}${kv('Repairs this month', fmt$(lt.repairSpend ?? 0))}</div><small>Fully funded maintenance means normal wear; unfunded doubles it. Capital reverses it, worst segment first. Each zoning batch adds a segment.</small>`);
    },
    weather() {
      const st = game.state, cfg = game.cfg, lt = st.lastTurn, m = st.turn ? monthIndex(st.turn, cfg) : cfg.FOUNDING_MONTH;
      openModal('Weather', `Midwest · ${MONTHS[m]}`, `<div class="card">${kv('Road wear multiplier', lt.weatherMod ? '×' + lt.weatherMod.toFixed(1) : '—')}${kv('Snow', lt.snow != null ? (lt.snow * 100).toFixed(0) + '%' : '—')}${lt.snow ? kv('Plowed by', lt.plowedBy) + kv('Roads open', (lt.passability * 100).toFixed(0) + '%') + kv('Clearing cost', fmt$(lt.plowCost)) : ''}</div><small>March–April is freeze-thaw: roads wear 60% faster. Snow from November to March. The county plows if you don't; it takes half the month and bills you.</small>`);
    },
  };
  for (const btn of document.querySelectorAll('[data-tool]')) btn.addEventListener('click', () => runTool(btn.dataset.tool));
  const tiles = { sPop: 'population', sTre: 'finance', sDes: 'desirability', sRoad: 'roads', sWx: 'weather', sSt: 'policy' };
  for (const [id, tool] of Object.entries(tiles)) $(id).parentElement.addEventListener('click', () => runTool(tool));

  // ── render ────────────────────────────────────────────────────────────────
  function render() {
    const st = game.state, cfg = game.cfg, lt = st.lastTurn;
    $('date').textContent = monthLabel(st.turn, cfg);
    renderCalendar(st, cfg);
    const occ = st.lots.filter(l => l.state === 'occupied').length, bld = st.lots.filter(l => l.state === 'construction').length;
    const cap = st.lots.filter(l => l.state === 'occupied').reduce((s, l) => s + l.capacity, 0);
    $('sPop').textContent = st.population;
    $('sPopS').textContent = lt.netMigration != null ? `${lt.netMigration >= 0 ? '+' : ''}${lt.netMigration} this month · housing for ${cap}` : `housing for ${cap}`;
    $('sTre').textContent = fmt$(st.treasury); $('sTre').className = 'v ' + (st.treasury < 0 ? 'bad' : '');
    $('sTreS').innerHTML = (lt.revenue != null ? `${fmt$(lt.revenue)} in · ${fmt$(lt.expenses)} out` : `${fmt$(st.tile.seed.income)}/mo from the land`) + ` · <span class="${gradeCls(st.credit.grade)}">${st.credit.grade}</span>${outstandingPrincipal(st) ? ' · debt ' + fmt$(outstandingPrincipal(st)) : ''}`;
    $('sDes').textContent = st.desirability.toFixed(0); $('sDes').className = 'v ' + cls(st.desirability, 55, 45);
    $('sDesS').textContent = lt.inputs ? `services ${lt.inputs.serviceQuality.toFixed(0)} · roads ${lt.inputs.infra.toFixed(0)} · taxes ${lt.inputs.taxBurden.toFixed(0)}` : '50 is neutral';
    const road = st.infrastructure.reduce((s, i) => s + i.condition, 0) / st.infrastructure.length;
    $('sRoad').textContent = road.toFixed(0); $('sRoad').className = 'v ' + cls(road, 70, 40);
    $('sRoadS').textContent = `${st.infrastructure.length} segment${st.infrastructure.length > 1 ? 's' : ''} · ${occ} homes · ${bld} building`;
    const m = st.turn ? monthIndex(st.turn, cfg) : cfg.FOUNDING_MONTH;
    if (lt.snow) { $('sWx').innerHTML = `<span class="snow">❄ Snow</span>`; $('sWxS').textContent = `${lt.plowedBy === 'own' ? 'your crew' : lt.plowedBy === 'mixed' ? 'you + county' : 'county'} plowed · ${fmt$(lt.plowCost)} · roads open ${(lt.passability * 100).toFixed(0)}%`; }
    else { $('sWx').textContent = m >= 2 && m <= 3 ? '🌧 Thaw' : m >= 10 || m <= 1 ? '🌨 Cold' : '☀ Clear'; $('sWxS').textContent = lt.weatherMod ? `road wear ×${lt.weatherMod.toFixed(1)}` : 'Midwest climate'; }
    $('sSt').textContent = st.takeover ? 'Takeover' : st.incorporated ? 'City' : 'Township'; $('sSt').className = 'v ' + (st.takeover ? 'bad' : st.incorporated ? 'good' : '');
    $('sStS').textContent = st.takeover ? `county in control since month ${st.takeover.sinceTurn}` : st.incorporated ? `incorporated · ${st.millage} mills` : canIncorporate(st, cfg) ? 'eligible to incorporate — see Policy' : `unincorporated · incorporate at ${cfg.INCORPORATION_POP}`;
    $('tBudget').classList.toggle('attn', st.turn % 12 === 0 && st.turn > 0 && !st.takeover);

    $('banner').innerHTML = st.takeover ? `<div class="banner"><b>County takeover.</b> Since month ${st.takeover.sinceTurn} (${st.takeover.reason}). The county has cut operations to a maintenance floor, zeroed capital, raised millage to ${st.millage}, and furloughed your equipment.${st.takeover.sold.length ? ` Sold: ${st.takeover.sold.map(x => `${x.label} for ${fmt$(x.price)}`).join(', ')}.` : ''} You get control back when the balance is positive with ${cfg.TAKEOVER_EXIT_RESERVE} months of reserves.</div>` : '';

    if (st.turn === 0) {
      $('monthCard').innerHTML = `<h3>You've staked a claim</h3><p>One tract of farmland, one dirt road, ${st.lots.length} lots surveyed, and ${fmt$(st.treasury)} in the bank. Population: you. The land pays ${fmt$(st.tile.seed.income)} a month. It's ${MONTHS[cfg.FOUNDING_MONTH]}; winter is ${(10 - cfg.FOUNDING_MONTH + 12) % 12} months out. Set a budget, or just end the month and see what happens.</p>`;
    } else {
      const bits = [];
      bits.push(`Revenue <b>${fmt$(lt.revenue)}</b>${lt.seedIncome ? ` (${fmt$(lt.seedIncome)} from the land${lt.fees ? `, ${fmt$(lt.fees)} in fees` : ''})` : lt.fees ? ` (${fmt$(lt.fees)} in fees)` : ''}, spent <b>${fmt$(lt.expenses)}</b>${lt.debtService ? ` including ${fmt$(lt.debtService)} debt service` : ''}.`);
      if (lt.snow) bits.push(`<span class="snow">Snow.</span> ${lt.plowedBy === 'county' ? 'The county plowed, eventually' : lt.plowedBy === 'mixed' ? 'Your crew and the county plowed' : 'Your crew plowed'} — roads open ${(lt.passability * 100).toFixed(0)}% of the month, ${fmt$(lt.plowCost)} for clearing.`);
      if (lt.repairSpend > 0) bits.push(`Spent ${fmt$(lt.repairSpend)} of capital on repairs.`);
      if (lt.netMigration > 0) bits.push(`<b>${lt.netMigration}</b> new resident${lt.netMigration > 1 ? 's' : ''} moved in.`);
      if (lt.netMigration < 0) bits.push(`<span class="bad">${-lt.netMigration} resident${lt.netMigration < -1 ? 's' : ''} left.</span>`);
      if (lt.lotsZoned) bits.push(`Zoned ${lt.lotsZoned} more lots and built a road segment.`);
      for (const a of st.assets) if (a.arrivesTurn === st.turn && a.type !== 'town-hall') bits.push(`Your <b>${a.label}</b> arrived.`);
      if (lt.outOfService?.length) bits.push(`<span class="warn">Out of service: ${lt.outOfService.join(', ')}.</span>`);
      if (lt.lotsStarted) bits.push(`${lt.lotsStarted} home${lt.lotsStarted > 1 ? 's' : ''} broke ground.`);
      if (lt.lotsCompleted) bits.push(`${lt.lotsCompleted} home${lt.lotsCompleted > 1 ? 's' : ''} finished and joined the tax rolls.`);
      if (lt.event?.type === 'storm') bits.push(`<span class="warn">A storm tore up ${lt.event.target}</span> (−${lt.event.damage} condition).`);
      if (lt.event?.type === 'grant') bits.push(`<span class="good">The county sent a ${fmt$(lt.event.amount)} grant.</span>`);
      for (const e of st.log) if (e.turn === st.turn) {
        if (e.type === 'county takeover') bits.push(`<span class="bad"><b>The county has taken over</b> (${e.reason}).</span>`);
        if (e.type === 'asset sold by county') bits.push(`<span class="bad">The county sold your ${e.what} for ${fmt$(e.price)}.</span>`);
        if (e.type === 'incorporated') bits.push(`<span class="good"><b>Incorporated.</b></span> A town hall goes up at the yard; seed income ends; bonds open.`);
        if (e.type === 'control returned') bits.push(`<span class="good"><b>Control returned</b> after ${e.after} months.</span> The county's budget stands until you adopt a new one.`);
      }
      if (st.credit.reviewedTurn === st.turn && st.turn) bits.push(`<b>Credit review: ${st.credit.grade}</b>${st.credit.previous !== st.credit.grade ? ` (was ${st.credit.previous})` : ''} — reserves ${st.credit.inputs.reserveMonths.toFixed(1)} mo, ${st.credit.inputs.deficitMonths} deficit month${st.credit.inputs.deficitMonths === 1 ? '' : 's'}, debt service ${(st.credit.inputs.debtServiceRatio * 100).toFixed(0)}% of revenue.`);
      if (st.deficitStreak && !st.takeover) bits.push(`<span class="bad">Treasury is negative — ${st.deficitStreak} month${st.deficitStreak > 1 ? 's' : ''} running. County takeover at ${cfg.TAKEOVER_DEFICIT_MONTHS}.</span>`);
      $('monthCard').innerHTML = `<h3>${monthLabel(st.turn, cfg)}</h3><p>${bits.join(' ')}</p>`;
    }

    const every = $('allRows').checked ? 1 : 12;
    let html = '<tr><th class="l">turn</th><th class="l">month</th><th>pop</th><th>desir</th><th>road</th><th>treasury</th><th>debt</th><th>cr</th><th>in/mo</th><th>out/mo</th><th>lots</th><th>homes</th><th class="l">notes</th></tr>';
    let carried = [];
    for (const r of game.rows) {
      const l = r.lastTurn;
      if (l.event) carried.push(l.event.type);
      if (l.lotsZoned) carried.push('zoned');
      for (const e of r.log) if (e.turn === r.turn) { if (e.type === 'borrowed') carried.push(`borrowed ${fmt$(e.amount)}`); if (e.type === 'purchase') carried.push('bought plow'); if (e.type === 'county takeover') carried.push('TAKEOVER'); if (e.type === 'control returned') carried.push('control returned'); if (e.type === 'incorporated') carried.push('incorporated'); }
      if (r.turn % every && r.turn !== game.rows.length - 1) continue;
      const rd = r.infrastructure.reduce((s, i) => s + i.condition, 0) / r.infrastructure.length;
      html += `<tr class="${r.incorporated ? 'inc' : ''} ${r.turn % 12 === 0 && r.turn ? 'year' : ''}"><td class="l">${r.turn}</td><td class="l">${r.turn ? monthLabel(r.turn, cfg) : '—'}</td><td>${r.population}</td><td>${r.desirability.toFixed(0)}</td><td>${rd.toFixed(0)}</td><td class="${r.treasury < 0 ? 'bad' : ''}">${fmt$(r.treasury)}</td><td>${fmt$(r.debt.reduce((s, d) => s + d.principal, 0))}</td><td class="${gradeCls(r.credit.grade)}">${r.credit.grade}</td><td>${fmt$(l.revenue ?? 0)}</td><td>${fmt$(l.expenses ?? 0)}</td><td>${r.lots.length}</td><td>${r.lots.filter(x => x.state === 'occupied').length}</td><td class="l">${(l.snow ? '❄ ' : '') + (r.takeover ? '⚠ ' : '') + carried.join(', ')}</td></tr>`;
      carried = [];
    }
    $('out').innerHTML = html;
    $('out').parentElement.scrollTop = 1e9;
  }

  renderConfig();
  found();
</script>
</body>
</html>
